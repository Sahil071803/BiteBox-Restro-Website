<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteBox - Contact</title>
  </head>
  <body>
    <h1>Contact Us</h1>
    <p>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="menu.html">Menu</a>
      <a href="contact.html">Contact</a>
    </p>
    
    
    <h2>Visit Our Website</h2>
    <p>
      <a href="https://www.google.com/" target="_blank">Visit Google</a>
    </p>

    <hr />

    <h2>Customer Registration and Order Form</h2>

    <form>
      <h3>Customer Information</h3>
      <label for="fullname">Full Name</label>
      <br />
      <input type="text" id="fullname" required />
      <br /><br />

      <label for="email">Email:</label>
      <br />
      <input type="email" id="email" required />

      <br /><br />

      <label for="Password">Password:</label>
      <br />
      <input type="password" id="password" name="password" />
      <br /><br />

      <label for="Phone">Phone:</label>
      <br />
      <input type="tel" id="Phone" required />

      <h3>Order Information</h3>

      <label for="quantity">Quantity</label>
      <br />
      <input type="number" id="quantity" name="quantity" />

      <br /><br />

      <label for="deliverydate">Delivery Date:</label>
      <br />
      <input type="date" id="deliverydate" name="deliverydate" />

      <br /><br />

      <label for="food">Food:</label>
      <br />
      <select id="food" name="food">
        <option value="" select>Select</option>
        <option value="pizza">Pizza</option>
        <option value="burger">Burger</option>
        <option value="pasta">Pasta</option>
        <option value="desserts">Desserts</option>
         <option value="coke">Coke</option>
         
      </select>

      <br /><br />

      <h3>Payment Method</h3>
      <input type="radio" id="card" name="payment" value="card" />
      <label for="card">Card</label>

      <br />

      <input type="radio" id="UPI" name="payment" />
      <label for="UPI">UPI</label>

      <br />
      <input type="radio" id="cash" name="payment" />
      <label for="cash">Cash</label>

      <br /><br />

      <h3>Extras</h3>
      <input type="checkbox" id="cheese" name="extras" />
      <label for="cheese"> Extra Cheese </label>
      <br />

      <input type="checkbox" id="drink" name="extras" />
      <label for="drink"> Cold Drink </label>
      <br />

      <input type="checkbox" id="dessert" name="extras" />
      <label for="dessert"> Dessert </label>
      <br /><br />

      <h3>Delivery Instructions</h3>

      <label for="address"> Delivery Address </label>

      <br />

      <textarea id="address" name="address" rows="5" cols="40"></textarea>

      <br /><br />
    </form>
  </body>
</html>
